services:
  - type: web
    name: property-finder-api
    runtime: node
    plan: free
    rootDir: property-finder-app
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/locations
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: property_finder
      - key: PROPERTY_DATABASE_PATH
        value: /tmp/properties.db
